[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slate-client"
version = "0.0.1"
description = "A typed Python client for the slate-orm gRPC head node"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "slate-orm contributors" }]

# `grpcio` and `protobuf` are runtime dependencies because the generated stubs
# import them. `grpcio-tools` deliberately is NOT: the stubs are committed, so
# installing this package needs no code generator. See
# `scripts/generate_proto.py` for the argument.
#
# The protobuf floor is 5.27: the committed stubs are generated by a protoc
# that emits the `runtime_version` guard, and an older runtime rejects them
# with a message about the descriptor pool rather than about the version.
dependencies = [
  "grpcio>=1.60",
  "protobuf>=5.27",
]

[project.optional-dependencies]
# Everything needed to regenerate the stubs and to run the suite. `mypy` is
# here rather than in a separate group because a type error in this package is
# a test failure, not a lint.
dev = [
  # The two code generators are pinned *exactly*, and everything else is not.
  #
  # Their output is committed, and `test_generated.py` regenerates it and
  # requires the result to match byte for byte. With a floating `>=` that test
  # passes or fails on upstream's release schedule rather than on anything in
  # this repository: it went green here on 1.83.1 and red in CI the same hour,
  # on whatever `pip` resolved to that morning, with no change to the `.proto`
  # or to the stubs. Committed generated code and an unpinned generator cannot
  # both be right.
  #
  # Raising these is a deliberate act: bump the pin, run
  # `python scripts/generate_proto.py`, and commit the regenerated stubs in the
  # same change so the diff shows what the new version did.
  "grpcio-tools==1.83.1",
  "mypy-protobuf==5.1.0",
  "mypy>=1.10",
  "pytest>=8",
  # A hanging stream is worse than a failing one: it stalls the suite and
  # says nothing. Every RPC here is loopback against an in-memory store.
  "pytest-timeout>=2",
  # Lint. In this package a lint finding is treated the same way a type error
  # is: the suite is not green until both are.
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# `py.typed` is what makes the annotations visible to a type checker in a
# consuming project; without it this package is typed for its own tests and
# opaque to everybody else. The generated `.pyi` files ship for the same
# reason.
slate = ["py.typed", "_proto/**/*.pyi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that hangs waiting on a stream is worse than one that fails: it stalls
# the suite and says nothing. Every RPC in the suite is against loopback and an
# in-memory store, so anything over a few seconds is a bug.
timeout = 120
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/slate", "tests"]
# The generated tree is not this package's code and is not held to its
# standards; `mypy-protobuf` produces stubs that are checked where they are
# *used*, which is the boundary that matters.
exclude = "src/slate/_proto/"

[[tool.mypy.overrides]]
module = "slate._proto.*"
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# `grpc` ships no stubs of its own.
module = "grpc.*"
ignore_missing_imports = true

[tool.ruff]
# The generated tree is protoc's output, not this package's code. It is checked
# where it is *used* — every call into it goes through mypy against the
# `mypy-protobuf` stubs — which is the boundary that matters.
extend-exclude = ["src/slate/_proto"]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # Long lines are almost all prose in docstrings, where wrapping to 100 makes
  # the argument harder to follow than the length does.
  "E501",
]
