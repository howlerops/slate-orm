# A head node with a `main`, for the Python client's tests.
#
# This crate exists because `slate-server` ships no binary and `slate-serverd`
# — the one that does — deliberately cannot produce the arrangements these
# tests need: a replica that will never catch up, and a lease somebody else
# holds forever. Those belong in a fixture, not in a daemon an operator runs.
#
# It is a member of the root workspace. It was not, once, and the reason given
# was that the work which created it could not edit the workspace manifest.
# That constraint is gone and the cost of the detachment was paid three times
# in one day: `cargo test --workspace` never built this crate, so a missing
# import, a catalog that stopped validating, and grants that predated a
# security change all sat here broken until someone happened to run the Python
# suite. One workspace, one lockfile, one build.

[package]
name = "slate-testserver"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
slate-server = { path = "../../../crates/slate-server" }
slate-kernel.workspace = true
slate-schema.workspace = true
slate-tuple.workspace = true

async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"
serde_json = "1"
