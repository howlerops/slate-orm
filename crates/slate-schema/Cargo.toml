[package]
name = "slate-schema"
description = "Schema and catalog metadata for the slate-orm record layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. The crates.io question is decided in `docs/releasing.md`:
# these are libraries this repository consumes by path, and publishing them
# commits to an API that changes weekly. Declared rather than left to the
# absence of a token, because a token added for one crate publishes every
# crate that did not say no.
publish = false

[dependencies]
slate-tuple.workspace = true
thiserror.workspace = true

[dev-dependencies]
bytes.workspace = true
uuid.workspace = true

[lints]
workspace = true
