[package]
name = "slate-kernel"
description = "Record layer kernel: keyspace, record store, executor and security enforcement"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
slate-tuple.workspace = true
slate-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
# For overlapping the point reads an index scan implies.
futures.workspace = true
regex.workspace = true
thiserror.workspace = true
# Only for the retry helper's backoff. The whole stack is async on tokio
# already, so this adds no new runtime requirement.
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
uuid.workspace = true
criterion.workspace = true
# For the planner oracle: the interesting queries are the ones nobody would
# think to write down.
proptest.workspace = true

[[bench]]
name = "queries"
harness = false

[lints]
workspace = true
