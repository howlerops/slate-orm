[package]
name = "slate-serverd"
description = "The head node as a process: a configured gRPC server over the slate-orm record layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "slate-serverd"
path = "src/main.rs"

[dependencies]
slate-server = { path = "../slate-server", version = "0.0.1" }
slate-slatedb.workspace = true
slate-kernel.workspace = true
slate-schema.workspace = true
slate-tuple.workspace = true
# For `IsolationLevel` only, which `SlateStore::with_isolation` takes and
# `slate-slatedb` does not re-export. Pinned to the version `slate-slatedb`
# resolves, so there is one copy of SlateDB in the build.
slatedb = { version = "0.16", default-features = false }

async-trait.workspace = true
uuid.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
# `TcpListenerStream`: the listener is bound before the banner is printed, so a
# client that connects the instant it reads the banner finds a socket already
# accepting. Handing tonic an address instead would leave a race no client can
# avoid, and `address = "…:0"` — which the tests need — could not report a port.
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14"

# Pinned to the version `slate-server` and SlateDB use. `Arc<dyn ObjectStore>`
# from a different copy of the crate is a different type, and the lease and the
# database have to share one store.
object_store = "0.14"

# The configuration file. TOML rather than YAML or JSON; see `config.rs` for
# the argument.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# `--print-schema` only. The output is for another program (a client generator,
# a drift check), so it is JSON rather than the human listing the rest of the
# process prints.
serde_json = "1"

# A real `--help`, and refusals for a mistyped flag. Hand-rolling one is what
# `clients/python/testserver` did, and it panics on a bad argument with a
# message naming no alternative.
clap = { version = "4", features = ["derive"] }

# Constant-time comparison for bearer tokens. `==` on a secret compares
# byte-by-byte and returns on the first difference, which is a timing oracle
# that recovers the token one byte at a time.
subtle = "2"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tonic = "0.14"

[lints]
workspace = true
