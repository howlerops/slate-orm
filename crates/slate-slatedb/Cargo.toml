[package]
name = "slate-slatedb"
description = "SlateDB storage backend for the slate-orm record layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
slate-kernel.workspace = true
async-trait.workspace = true
bytes.workspace = true
slatedb = { version = "0.16", default-features = false }
# For replica catch-up waits; SlateDB already requires a tokio runtime.
tokio = { workspace = true, features = ["time"] }
uuid.workspace = true

[features]
default = ["aws"]
# S3-compatible object storage: AWS S3, MinIO, Tigris, Cloudflare R2.
aws = ["slatedb/aws"]

[dev-dependencies]
# For the object-store fault injector, whose trait methods return boxed streams.
futures.workspace = true
slate-schema.workspace = true
slate-tuple.workspace = true
tokio = { workspace = true, features = ["net"] }
# A real S3 server, in process: the S3 code path is exercised for real in CI
# without a Docker service container.
s3s = "0.14"
s3s-fs = "0.14"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
tempfile = "3"

[lints]
workspace = true
