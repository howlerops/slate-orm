[package]
name = "slate-tuple"
description = "Order-preserving tuple encoding for the slate-orm record layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Not published. The crates.io question is decided in `docs/releasing.md`:
# these are libraries this repository consumes by path, and publishing them
# commits to an API that changes weekly. Declared rather than left to the
# absence of a token, because a token added for one crate publishes every
# crate that did not say no.
publish = false

[dependencies]
bytes.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
# For the build stamp in `benches/codec.rs`, so a recorded microbenchmark says
# whether it came from a debug or a release build. A *dev*-dependency cycle:
# `slate-kernel` depends on this crate normally, and cargo resolves the two
# separately, so nothing here ships with the cycle. The alternative was a
# fourth build script in the workspace's bottom crate to re-derive four
# strings cargo already sets.
slate-kernel.workspace = true

[[bench]]
name = "codec"
harness = false

[lints]
workspace = true
