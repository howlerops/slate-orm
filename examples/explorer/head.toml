# The head node the three adapters share.
#
# One database, three clients: that is the whole point of the demo, and it is
# also what makes the conformance runner meaningful — a disagreement cannot be
# blamed on the data.

[listen]
address = "127.0.0.1:7421"

[auth]
mode = "trusted-header"

[storage]
backend = "memory"

[[tables]]
name = "authors"
id = 1
columns = [
  { name = "id",      type = "u64" },
  { name = "name",    type = "str" },
  { name = "country", type = "str" },
  { name = "born",    type = "i64" },
]
primary_key = ["id"]

[[tables]]
name = "books"
id = 2
columns = [
  { name = "id",        type = "u64" },
  { name = "author_id", type = "u64" },
  { name = "title",     type = "str" },
  { name = "year",      type = "i64" },
  { name = "rating",    type = "f64" },
  # Seconds since the epoch, which is what a timestamp is here — there is no
  # date type. Appended rather than inserted, so every ordinal above it stays
  # where the three adapters and the row policy already say it is.
  #
  # Added so the conformance corpus can compare the three SDKs on a *calendar*
  # expression. It could compare them on arithmetic and on nothing else, and
  # "the three clients agree about `year / 10 * 10`" is a much weaker claim
  # than it looks: division is the one scalar every language spells the same.
  { name = "released",  type = "i64" },
  # A four-dimensional embedding, so nearest-neighbour search is comparable
  # across the three SDKs as well. Four rather than a realistic 768 because
  # the point is that three clients build the same `Distance` scalar and agree
  # on the *order* it produces, and a seed file nobody can read by eye makes
  # that harder to check rather than more convincing.
  { name = "embedding", type = "vector" },
  # A price, in cents. Appended for the same reason as the two above, and for
  # the same kind of reason: `Value` has a decimal arm that no adapter could
  # reach, so the conformance corpus could not compare the three SDKs on the
  # one value type that is *not* the number it looks like. `1250` here is
  # 12.50, and a client that renders it against the wrong scale is off by a
  # factor of a hundred with nothing anywhere reporting it.
  { name = "price",     type = "decimal", scale = 2 },
]
primary_key = ["id"]

# The demo's one CHECK, here so `--print-schema` publishes a real constraint
# and the generated declarations carry one rather than an empty list nobody
# has looked at. Deliberately weak — every seeded year is a real year — because
# a demo constraint that rejected the demo's own data would be a trap for the
# next person to add a row, not a better demonstration.
#
# `column` and `message` are what a form reads: the refusal arrives naming
# `year` and carrying this sentence, instead of naming a rule the caller has to
# map back to a field.
[[tables.checks]]
name = "year_is_positive"
predicate = "year > 0"
column = "year"
message = "Year must be a positive number."

[[tables]]
name = "sales"
id = 3
columns = [
  { name = "id",      type = "u64" },
  { name = "book_id", type = "u64" },
  { name = "units",   type = "i64" },
]
primary_key = ["id"]

# The demo's one foreign key, and so its one relationship.
#
# Not `books.author_id -> authors`, which is the obvious candidate and cannot
# be one: `Author Unknown` names author 99 on purpose, so that a right or full
# join has an unmatched side to show. A foreign key would refuse that row at
# write time, and the join demonstration would go with it.
#
# `sales.book_id` has no such orphan, and reading it backwards -- the books
# behind a page of sales -- goes through the table that carries the row
# policy, which is what makes the conformance case worth running as `reader`.
[[tables.foreign_keys]]
name = "sale_book"
parent = "books"
columns = ["book_id"]

# A table declared after `sales`' key on purpose: in TOML a
# `[[tables.foreign_keys]]` attaches to the most recent `[[tables]]`, so
# putting this above `sale_book` silently moved that key onto `editions` and
# left `sales` with none. The conformance runner caught it on the next run —
# six cases that had nothing to do with editions all started refusing.
[[tables]]
name = "editions"
id = 4
columns = [
  { name = "id",      type = "u64" },
  { name = "book_id", type = "u64" },
  { name = "format",  type = "str" },
]
primary_key = ["id"]

# The demo's *second* foreign key, and so the reason it can demonstrate a
# relationship **path** rather than only a relationship.
#
# `sales -> books -> editions` is two steps in opposite directions: up to the
# book a sale sold, then down to that book's editions. One request, two reads,
# and the second read's keys are the first read's rows — which is the whole
# point and is what a client looping per row would get wrong by being slower
# rather than by being different.
[[tables.foreign_keys]]
name = "edition_book"
parent = "books"
columns = ["book_id"]

[[tables]]
name = "shipments"
id = 5
columns = [
  { name = "id",      type = "u64" },
  { name = "book_id", type = "u64" },
  # The demo's one enumerated column, and the reason this table exists.
  #
  # The generator turns a `column in (…)` check over a `str` into a narrowed
  # type — `Literal["pending", …]` in Python, a union in TypeScript. Until
  # this column that narrowing was proved only against catalogs invented
  # inside `scripts/test_codegen.py`, which is a test of the matcher and not
  # of the pipeline: nothing showed a real `--print-schema` reaching a real
  # generated file with a real type in it.
  { name = "status",  type = "str" },
  # And the demo's one soft delete, for the same reason. `include_deleted`
  # crosses the wire and `purge_deleted` erases what it finds, and neither had
  # a table in this repository to act on.
  #
  # Nullable and `i64`, which is what `soft_delete` requires: a retired row
  # carries the second it was retired, a live one carries null.
  { name = "deleted_at", type = "i64", nullable = true },
]
primary_key = ["id"]
soft_delete = "deleted_at"

[[tables.checks]]
name = "status_known"
predicate = "status in ('pending', 'shipped', 'delivered')"
column = "status"
message = "Status must be pending, shipped or delivered."

# A second check, so that one bad row breaks *two* rules.
#
# The point is the list. A refusal carries `violations`, `check.N`, `column.N`
# and `message.N`, and three clients decode them by counting up — but with one
# check in the whole demo, the live case could only ever exercise the
# singleton. Reading one failure and reading a list are different code, and
# only the fixture in each client's unit suite had ever reached the second.
#
# `9000` and above is the range the adapters' own handlers write into
# (`purge` owns 9401-9403, `bad-status` writes 9499), so a seeded row cannot
# accidentally violate it and a handler's row deliberately does.
[[tables.checks]]
name = "id_is_seeded"
predicate = "id < 9000"
column = "id"
message = "Shipment ids above 9000 are reserved for the demo's own handlers."

# A third foreign key, so a soft-deleted row is also a *referencing* row.
#
# It makes the retirement path do something worth watching: retiring a shipment
# goes through `remove_row`, which maintains every index across the transition
# rather than deleting the row, and a parent that is still referenced by a
# retired child is still referenced.
[[tables.foreign_keys]]
name = "shipment_book"
parent = "books"
columns = ["book_id"]

# `app` can do everything, including EXPLAIN.
[[security.grants]]
role = "app"
tables = ["authors", "books", "sales", "editions", "shipments"]
actions = ["everything"]

# `reader` can read and nothing else — notably not EXPLAIN, which is its own
# action precisely because a plan is costed against rows a policy may hide,
# and notably not `read_deleted`, which is its own action for the same shape of
# reason: a soft delete hides a row from every ordinary read, so lifting that
# shows rows the application decided were gone.
#
# `everything` above grants both. This grant is what makes the refusal
# demonstrable: `reader` may read `shipments` and may not ask to see the
# retired ones.
[[security.grants]]
role = "reader"
tables = ["authors", "books", "sales", "editions", "shipments"]
actions = ["read"]

# `stranger` holds a role with no grant at all. Every table is denied, and the
# demo shows the refusal rather than an empty table — the difference between
# "nothing matched" and "you may not ask" is one the UI makes visible.
[[security.grants]]
role = "stranger"
tables = ["sales"]
actions = ["read"]

# Row-level security on `books`.
#
# Worth reading carefully, because the first version of this file was wrong in
# an instructive way: **adding any policy to a table turns row-level security
# on for that table**, and once it is on, every role needs a policy for every
# action it performs. A single read-scoped policy therefore locked `app` out of
# writing — correctly, fail-closed — and the seeder failed with "row-level
# security forbids writing this row".
#
# So there are two policies: one that restricts what a `reader` may see, and one
# that lets `app` keep doing everything. Nothing in any adapter enforces either.

# A reader sees only books published in or after 1960. Switching identity in the
# UI shows this holding, identically, through all three SDKs.
[[security.policies]]
name = "modern_only"
table = "books"
actions = ["read"]
roles = ["reader"]
using = "year >= 1960"

# And `app` keeps unrestricted access, which RLS being on would otherwise take
# away.
[[security.policies]]
name = "app_sees_everything"
table = "books"
actions = ["read", "insert", "update", "delete"]
roles = ["app"]
using = "true"
