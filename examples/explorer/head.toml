# The head node the three adapters share.
#
# One database, three clients: that is the whole point of the demo, and it is
# also what makes the conformance runner meaningful — a disagreement cannot be
# blamed on the data.

[listen]
address = "127.0.0.1:7421"

[auth]
mode = "trusted-header"

[storage]
backend = "memory"

[[tables]]
name = "authors"
id = 1
columns = [
  { name = "id",      type = "u64" },
  { name = "name",    type = "str" },
  { name = "country", type = "str" },
  { name = "born",    type = "i64" },
]
primary_key = ["id"]

[[tables]]
name = "books"
id = 2
columns = [
  { name = "id",        type = "u64" },
  { name = "author_id", type = "u64" },
  { name = "title",     type = "str" },
  { name = "year",      type = "i64" },
  { name = "rating",    type = "f64" },
  # Seconds since the epoch, which is what a timestamp is here — there is no
  # date type. Appended rather than inserted, so every ordinal above it stays
  # where the three adapters and the row policy already say it is.
  #
  # Added so the conformance corpus can compare the three SDKs on a *calendar*
  # expression. It could compare them on arithmetic and on nothing else, and
  # "the three clients agree about `year / 10 * 10`" is a much weaker claim
  # than it looks: division is the one scalar every language spells the same.
  { name = "released",  type = "i64" },
  # A four-dimensional embedding, so nearest-neighbour search is comparable
  # across the three SDKs as well. Four rather than a realistic 768 because
  # the point is that three clients build the same `Distance` scalar and agree
  # on the *order* it produces, and a seed file nobody can read by eye makes
  # that harder to check rather than more convincing.
  { name = "embedding", type = "vector" },
]
primary_key = ["id"]

[[tables]]
name = "sales"
id = 3
columns = [
  { name = "id",      type = "u64" },
  { name = "book_id", type = "u64" },
  { name = "units",   type = "i64" },
]
primary_key = ["id"]

# `app` can do everything, including EXPLAIN.
[[security.grants]]
role = "app"
tables = ["authors", "books", "sales"]
actions = ["everything"]

# `reader` can read and nothing else — notably not EXPLAIN, which is its own
# action precisely because a plan is costed against rows a policy may hide.
[[security.grants]]
role = "reader"
tables = ["authors", "books", "sales"]
actions = ["read"]

# `stranger` holds a role with no grant at all. Every table is denied, and the
# demo shows the refusal rather than an empty table — the difference between
# "nothing matched" and "you may not ask" is one the UI makes visible.
[[security.grants]]
role = "stranger"
tables = ["sales"]
actions = ["read"]

# Row-level security on `books`.
#
# Worth reading carefully, because the first version of this file was wrong in
# an instructive way: **adding any policy to a table turns row-level security
# on for that table**, and once it is on, every role needs a policy for every
# action it performs. A single read-scoped policy therefore locked `app` out of
# writing — correctly, fail-closed — and the seeder failed with "row-level
# security forbids writing this row".
#
# So there are two policies: one that restricts what a `reader` may see, and one
# that lets `app` keep doing everything. Nothing in any adapter enforces either.

# A reader sees only books published in or after 1960. Switching identity in the
# UI shows this holding, identically, through all three SDKs.
[[security.policies]]
name = "modern_only"
table = "books"
actions = ["read"]
roles = ["reader"]
using = "year >= 1960"

# And `app` keeps unrestricted access, which RLS being on would otherwise take
# away.
[[security.policies]]
name = "app_sees_everything"
table = "books"
actions = ["read", "insert", "update", "delete"]
roles = ["app"]
using = "true"
