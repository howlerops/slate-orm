# A head node serving the workbench's dataset from object storage.
#
# The tables are the workbench's, column for column and id for id — see
# `crates/slate-wasm/src/taxi.rs`. That is the whole point of this example: the
# browser runs the kernel in a tab against these tables, and this runs the same
# kernel behind gRPC, behind SlateDB, behind an S3 bucket. Same data, same
# questions, two entirely different paths to the answer.
#
# `run.sh` fills in `[storage.s3]` from the environment the S3 server printed.

[listen]
address = "127.0.0.1:0"

[auth]
mode = "trusted-header"

[storage]
backend = "s3"
# Wait for object storage before acknowledging a write. The other setting,
# `visible`, returns as soon as readers can see it and loses acknowledged
# writes if the writer dies before its next flush — which is the right trade
# for a cache and the wrong one for a demonstration that claims durability.
durability = "durable"

[storage.s3]
# Everything from `SLATE_S3_*`, which is how the same file points at the local
# server, at MinIO, or at a real bucket without being edited.
from_env = true

[[tables]]
name = "trips"
id = 3
columns = [
  { name = "id",           type = "u64" },
  { name = "pickup_zone",  type = "u64" },
  { name = "dropoff_zone", type = "u64" },
  # Seconds since the epoch. There is no date type, here or in the kernel.
  { name = "pickup_time",  type = "i64" },
  { name = "duration",     type = "i64" },
  # The one nullable column, because the source really is missing it on 4.7%
  # of rows. Filling it in would make `count(passengers)` a synonym for
  # `count(*)`.
  { name = "passengers",   type = "i64", nullable = true },
  { name = "distance",     type = "f64" },
  { name = "fare",         type = "f64" },
  { name = "tip",          type = "f64" },
  { name = "total",        type = "f64" },
  { name = "payment",      type = "str" },
]
primary_key = ["id"]

[[tables.indexes]]
name = "by_pickup_zone"
id = 1
columns = ["pickup_zone"]

[[tables]]
name = "zones"
id = 4
columns = [
  { name = "id",           type = "u64" },
  { name = "borough",      type = "str" },
  { name = "zone",         type = "str" },
  { name = "service_zone", type = "str" },
]
primary_key = ["id"]

# Two read replicas beside the writer, so a read can be served by something
# that is not the process that wrote it.
#
# `following` means each one re-reads the manifest on a poll and serves the
# snapshot it has reached. That is where the interesting failure lives: a read
# carrying a sequence can only be served by a replica that has *polled* past
# it, so `[routing] catch_up` is both the budget the pool waits and the thing
# that derives the poll interval — a poll longer than the budget means no such
# read can ever be served by a replica. `slate-serverd` refuses a
# `poll_interval` at or above `catch_up` for that reason.
[[replicas]]
name = "reader-a"

[[replicas]]
name = "reader-b"

[routing]
# Two seconds, which is long for a local filesystem bucket and short enough
# that a check waiting on it does not look hung. The replicas' poll interval
# derives from this.
catch_up = "2s"

[lease]
# Three seconds instead of the default fifteen, which is the whole reason this
# section exists: `run.sh` kills the head node and starts another, and the new
# one cannot open the writer until the dead one's lease has expired. Nothing
# renews a lease on behalf of a process that is gone, so the wait is exactly
# this term.
#
# That is the trade a deployment makes here, and it is not free either way. A
# short term means a fast replacement and more writes to the lease object; it
# also means less slack for a leader that is alive but paused — a stop-the-world
# GC, a stalled disk, a throttled bucket — and a leader that misses its renewal
# is fenced whether or not it was actually dead. Three seconds is right for an
# example that has to finish; it would be reckless in production.
term = "3s"

[[security.grants]]
role = "app"
tables = ["trips", "zones"]
actions = ["everything"]
