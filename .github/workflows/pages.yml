# Publish `site/` to GitHub Pages.
#
# Two static pages and a stylesheet with no build step, so this uploads the
# directory as it stands. The quickstarts on those pages are *executed* by the
# `quickstarts` job in `ci.yml` — this workflow deliberately does not repeat
# that check, but it does depend on it having run: publishing a landing page
# whose first code block does not work is the failure the checker exists for,
# and it is worth saying out loud that the guard lives one workflow over.
#
# Enables Pages itself on the first run (`enablement: true` below), so a fresh
# clone of this repository does not need somebody to find Settings → Pages
# before the site can publish. If the token is not permitted to do that, the
# run fails with a `Not Found` from the Pages API and the setting has to be
# changed by hand — which is what happened before this was added.
name: Pages

# Every push to `main`, with no `paths` filter, and that is deliberate.
#
# The filter was `paths: ["site/**", ".github/workflows/pages.yml"]`, which
# looks like an obvious saving and has a failure mode with no symptom. Creating
# `main` did not match it — a branch-creation push has no diff to filter
# against — so the site would not have published at all, and nothing anywhere
# would have said so. The same shape of filter, in `release.yml`, would have
# made a tagged release upload nothing.
#
# Publishing three static files costs seconds and is idempotent. A deploy that
# silently does not happen costs a stale site nobody notices.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository, write a Pages deployment, and mint the OIDC token the
# deploy action exchanges. No broader token than that.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight: a half-applied
# deploy is a site serving a mix of two versions.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `enablement: true` turns Pages on if it is off, rather than failing and
      # waiting for somebody to visit Settings → Pages.
      #
      # The default is `false`, and the failure it produces is a bare `Not
      # Found` from the Pages REST API — accurate, unhelpful, and the sort of
      # thing that leaves a deploy permanently one manual step away from
      # working. The token below already carries `pages: write`; if it did not,
      # this fails with the same message as before and the setting has to be
      # changed by hand.
      # The playground's wasm, built here rather than committed.
      #
      # Nothing in `site/` is generated except this, and it is generated on
      # every deploy so the binary cannot drift from the kernel it claims to
      # be. The cost is a Rust build in the deploy path; the alternative is a
      # checked-in blob that is right until somebody forgets.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: sh site/build-wasm.sh

      # After the build, not before it: two of these files are produced by the
      # step above, and checking for them first is a guard that fails on every
      # run. The deploy takes `site/` verbatim, so a file missing here is a 404
      # in production rather than a build error.
      - name: The pages exist
        run: |
          for page in site/index.html site/docs.html site/style.css \
                      site/playground.js site/slate_wasm.js site/slate_wasm_bg.wasm; do
            [ -s "$page" ] || { echo "$page is missing or empty" >&2; exit 1; }
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # `enablement: true` above is best-effort: it needs the workflow token to
      # be allowed to *create* the Pages site, and in this repository it is
      # not — `Resource not accessible by integration`. That is an accurate
      # message and a useless one to whoever has to act on it, so say what to
      # do. The job still fails, which is right; it just fails legibly.
      - name: If that failed, here is why and what to do
        if: failure()
        run: |
          cat >&2 <<'MESSAGE'

          GitHub Pages is not enabled for this repository, and this workflow is
          not permitted to enable it.

          A person with repository admin has to do it once:

              Settings -> Pages -> Build and deployment -> Source: GitHub Actions

          Nothing else is needed. Re-run this workflow afterwards, or push
          anything to `main`, and the site publishes.
          MESSAGE
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
