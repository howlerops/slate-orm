# Publish the head node on a tag.
#
# `slate-serverd` is the only thing here that is shippable: one binary, one
# TOML file, no runtime. The three client packages are deliberately *not*
# published — see the note at the bottom.
#
# The build itself lives in `release-build.yml`, which `ci.yml` also calls on
# every push. A release workflow is otherwise exercised for the first time on
# the day somebody cuts a release, which is the worst day to discover the
# aarch64 linker is missing — and that is exactly the state `ci.yml` was in
# until it was made to fire: active, plausible, and never once run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Deliberately no `paths` filter on the trigger above, and worth saying why:
  # adding one next to `tags` would apply it to the tag push, so tagging a
  # commit that happened not to touch these files would build and publish
  # nothing. A release workflow that silently does not run is worse than one
  # that has never run.
  build:
    uses: ./.github/workflows/release-build.yml

  publish:
    name: attach the binaries
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Only a tag publishes. A `workflow_dispatch` run builds and checks and
    # stops here: releases are cut from tags, and a workflow that can publish
    # one without a version number is a workflow that eventually does.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Nothing here is production-ready and the README says so; a release
          # that does not say so is read as a promise.
          prerelease: true

# Unverified, and deliberately so: the `publish` job. Everything it depends on
# runs on every push through `ci.yml`, but `softprops/action-gh-release` needs a
# real `v*` tag, and pushing one publishes a release that cannot be quietly
# withdrawn. It is the one thing here that has to be exercised by a person who
# means it.
#
# Deliberately absent: publishing `slate-client` to PyPI, `@slate-orm/client`
# to npm, or tagging the Go module for a proxy.
#
# Not an oversight and not laziness. Each needs a credential this repository
# does not hold, a name nobody has claimed, and a decision about stability that
# has not been made. The landing page's install lines used to name packages
# that do not exist anywhere; the fix for that was to reword the page, not to
# wire up a token and find out.
