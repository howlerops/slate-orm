name: CI

# Every push, not just `main`. This workflow was added months ago, triggered on
# `main` and pull requests only, and every branch since has been a feature
# branch with no pull request open — so it had run exactly zero times, and "the
# repository has CI" was true of the file and of nothing else. Its first real
# run failed immediately on an image tag that had been withdrawn upstream. A
# check that never fires is a check nobody has debugged.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A pull request from a branch in this repository would otherwise build twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Its own job, not the first step of the one below, and the reason is worth
  # the extra runner. `cargo fmt --all -- --check` takes seconds and needs no
  # build, but as step one of `rust` a single missing line break failed that
  # job before clippy or any of the workspace tests had run — so a commit whose
  # only fault was whitespace reported exactly the same red as one that broke
  # the kernel, and reported nothing about whether it had. That happened, and
  # the run read as "failed but blocked nothing" because the other fourteen
  # jobs are independent and went green around it.
  #
  # Split, a formatting miss says "formatting" and the tests still say whether
  # the code works. No cache: `cargo fmt` parses the sources and does not
  # compile them, so there is nothing for `rust-cache` to restore.
  fmt:
    name: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust:
    name: clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # `cargo test --workspace` builds default features, so an optional one is
      # a corner nothing compiles — the same shape as a workflow filter that
      # never matches. `slate-orm`'s `json` feature is the only one there is;
      # named explicitly rather than `--all-features`, which would also switch
      # on `slate-slatedb`'s storage features and change what the other jobs
      # are testing.
      - run: cargo clippy -p slate-orm --features json --all-targets
      - run: cargo test -p slate-orm --features json
      - name: Soak the tuple codec properties
        run: cargo test --release -p slate-tuple --test ordering
        env:
          PROPTEST_CASES: 200000
      - run: cargo doc --workspace --no-deps

  # The daemon and the Python fixture, built once and handed to every job that
  # needs one. Four jobs used to mean four checkouts of the Rust toolchain
  # building the same binary; `SLATE_SERVERD` and `SLATE_TESTSERVER` are what
  # let them share, and they are the same variables a contributor uses locally
  # to run a client suite with no Rust installed.
  binaries:
    name: build the head node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Two invocations, not one. `cargo build -p a -p b --bin x` applies the
      # `--bin` filter across *both* packages, so a single command asking for
      # `--bin slate-serverd` built the daemon and quietly skipped the Python
      # fixture — and `upload-artifact` only errors when it finds *no* files,
      # so the artifact uploaded happily with half its contents and the Python
      # job failed two minutes later on a missing path.
      - run: cargo build -p slate-serverd --bin slate-serverd
      - run: cargo build -p slate-testserver --bin slate-testserver
      # And say so here rather than at the download: a truncated artifact is
      # cheaper to diagnose in the job that produced it.
      - name: Both binaries exist
        run: |
          for b in slate-serverd slate-testserver; do
            [ -x "target/debug/$b" ] || { echo "target/debug/$b was not built" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: head-node
          path: |
            target/debug/slate-serverd
            target/debug/slate-testserver
          if-no-files-found: error
          retention-days: 1

  go:
    name: Go client
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: clients/go/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: head-node
          path: bin
      - run: chmod +x bin/slate-serverd
      # `TestStubsAreFresh` regenerates the committed Go stubs and compares
      # them byte for byte. It needs `protoc`, skips without it, and its own
      # comment used to claim CI installed one -- which no job did, so the
      # check had never run outside a laptop and the stubs went stale a second
      # time with this job green. `SLATE_REQUIRE_PROTOC` below turns the skip
      # into a failure, so dropping this step is loud rather than silent.
      - name: The protobuf compiler, for the stub-freshness check
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: go vet ./...
        working-directory: clients/go
      - run: go test ./...
        working-directory: clients/go
        env:
          SLATE_SERVERD: ${{ github.workspace }}/bin/slate-serverd
          SLATE_REQUIRE_PROTOC: "1"

  python:
    name: Python client
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: head-node
          path: bin
      - run: chmod +x bin/slate-testserver
      # uv from pip rather than `astral-sh/setup-uv`, deliberately: the action
      # is the idiomatic route and pinning it means pinning two things whose
      # versions I cannot check from here, and a fabricated tag is a red build
      # that teaches nothing. One `pip install` of a small wheel costs a second
      # and is verifiable. Worth revisiting once somebody confirms the action's
      # current major.
      - run: pip install uv==0.8.17
      # `uv pip install --system` rather than `pip install`: the same
      # resolution into the same interpreter `setup-python` put on the PATH,
      # and fast enough that installing stops being the slowest step here.
      - run: uv pip install --system -e '.[dev]'
        working-directory: clients/python
      # Before the suite, and as separate steps, on purpose. `pyproject.toml`
      # has said since this package was written that a type error here is a
      # test failure rather than a lint, and the same of a ruff finding — and
      # nothing ran either, for months. Both tools were in `[dev]` and
      # therefore installed and then never invoked, which is the most
      # expensive way to not have a check.
      #
      # Separate steps rather than one `&&` so the log names which one failed
      # without anybody reading it, and *before* the suite because they take
      # seconds and the suite takes minutes.
      - run: ty check
        working-directory: clients/python
      - run: ruff check .
        working-directory: clients/python
      - run: python -m pytest -q
        working-directory: clients/python
        env:
          SLATE_TESTSERVER: ${{ github.workspace }}/bin/slate-testserver

  typescript:
    name: TypeScript client
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: head-node
          path: bin
      - run: chmod +x bin/slate-serverd
      - run: npm ci
        working-directory: clients/typescript
      - run: npm test
        working-directory: clients/typescript
        env:
          SLATE_SERVERD: ${{ github.workspace }}/bin/slate-serverd

  frontend:
    name: demo frontend units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: examples/explorer/web/package-lock.json
      - run: npm ci
        working-directory: examples/explorer/web
      - run: npm run typecheck
        working-directory: examples/explorer/web
      - run: npm test
        working-directory: examples/explorer/web

  hooks:
    name: the pre-commit hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The hook refuses a commit that changes anything outside `ledger/`
      # without an entry, and refuses an entry that says nothing. It is the
      # only check here that guards the *reasoning*, and it had no test until
      # the day it started rejecting every commit in the repository silently.
      - run: sh .githooks/test-pre-commit.sh

  layout:
    name: no crate outside the workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A crate outside the workspace is never built by `cargo test
      # --workspace`, so it rots silently. That happened to
      # `clients/python/testserver`: three separate things broke in it
      # unnoticed. This is the guard the fix asked for.
      - run: python3 scripts/check_workspace.py

  scripts:
    name: the Python that is not the client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ty needs the `slate` package to resolve, because half of what it checks
      # here imports it: the deployed harness, the batch benchmark and the
      # explorer's Python adapter are all clients. Installed from the tree
      # rather than from an index, so the checker sees the same package the
      # rest of CI tests.
      - run: pip install uv==0.8.17
      - run: uv pip install --system -e './clients/python[dev]'
      # About five thousand lines that neither tool had ever seen: two code
      # generators, four harnesses, three site checks, the conformance runner,
      # the explorer's adapter and the workspace guard. `clients/python` has
      # had both for months and the code that *runs twelve of the jobs beside
      # this one* had neither — so a harness could carry a name error in a
      # branch nobody takes and the first anyone would know is a red job with a
      # traceback in it.
      #
      # Separate steps for the reason the Python client's are: the log names
      # which one failed without anybody reading it.
      - run: ty check
      - run: ruff check .
      # The generator's own tests, on synthetic catalogs. The real check on it
      # is the conformance job, which regenerates and diffs and then runs three
      # SDKs against the result — but that can only exercise the shapes the
      # demo's schema has, and the cases most worth getting right (a dropped
      # column, an unknown type) are ones it does not.
      - run: python3 scripts/test_codegen.py
      # The demo's *generated* Python decoders, executed. The step above tests
      # the generator against catalogs it invents; this tests the file the demo
      # actually imports, against the ordinals the real catalog declares, and a
      # generator right about the first and wrong about the second passes the
      # step above. Go and TypeScript have had this since their decoders
      # shipped compiled-but-never-run; Python did not.
      #
      # Here rather than in the `demo` job, where its two siblings live,
      # because those need a built server and a browser and this needs neither
      # — only the committed file and the installed client. That also lets
      # `check.sh` run it, which it cannot do for the other two.
      - run: python3 -m pytest examples/explorer/backends/python/adapter -q
      # That `scripts/check.sh` still lists every step in this file, or says
      # why it cannot run one. The script exists because three commits in one
      # afternoon went red on checks that existed and were run from the wrong
      # directory; a list that falls behind would be the same story with an
      # extra step, and this is what stops it. Adding a step above fails here
      # until somebody classifies it.
      - run: python3 scripts/test_check_sh.py
      # The mutation harness's own tests. They use a fake `cargo` — a few lines
      # of Python that print what a real run prints — so this needs no
      # toolchain and takes milliseconds, which is why it sits with the static
      # checks rather than beside the suites it drives.
      - run: python3 scripts/test_mutate.py
      # Every test `docs/` names as a demonstration must be openable.
      # `docs/security-review.md` spent a week citing four probes that
      # their own fix commits had renamed, and nothing compiles a
      # document, so only a check finds it.
      - run: python3 scripts/check_cited_tests.py
      - run: python3 scripts/test_check_cited_tests.py
      # And the same one level over: every `docs/*.md` a *source file* points
      # at must be openable. An error message ending "See docs/ctes.md" sends
      # a reader who is already confused to a file that may not be there, and
      # nothing compiles a path in a string literal either.
      - run: python3 scripts/check_site_claims.py
      - run: python3 scripts/test_check_site_claims.py
      - run: python3 scripts/check_site_css.py
      - run: python3 scripts/test_check_site_css.py
      - run: python3 scripts/check_build_output.py
      - run: python3 scripts/test_check_build_output.py
      - run: python3 scripts/check_caveat_citations.py
      - run: python3 scripts/test_check_caveat_citations.py
      - run: python3 scripts/check_closed_caveats.py
      - run: python3 scripts/test_check_closed_caveats.py
      - run: python3 scripts/check_none_last.py
      - run: python3 scripts/test_check_none_last.py
      - run: python3 scripts/check_cited_docs.py
      - run: python3 scripts/test_check_cited_docs.py
      # A handler must authorise before it touches a table's shape.
      # Security finding 8 was fixed twice — the second time because
      # the first covered the handlers it was written about and the
      # read paths went on resolving, then converting, then checking.
      - run: python3 scripts/check_handlers.py
      - run: python3 scripts/test_check_handlers.py
      - run: python3 examples/explorer/conformance/test_conformance.py
      - run: python3 scripts/check_demo_surface.py
      - run: python3 scripts/test_check_demo_surface.py
      - run: python3 scripts/test_run_examples.py
      # …and that every crate with an `examples/` directory is in the
      # runner's table at all. Two were not, and were run by nothing:
      # the same defect as `headbench` and `slatedbbench` below, a
      # third and fourth time.
      - run: python3 scripts/check_examples_roster.py
      - run: python3 scripts/test_check_examples_roster.py
      # …and that no comment states a cost constant's old value. The
      # planner's reasoning lives in prose around three numbers, and when
      # `POINT_READ_COST` was re-measured from 3.0 to 1.0 eight files went
      # on saying three — five of them deriving a crossover that had moved
      # by the same factor.
      - run: python3 scripts/check_cost_prose.py
      - run: python3 scripts/test_check_cost_prose.py
      - run: python3 scripts/check_build_stamp.py
      - run: python3 scripts/test_check_build_stamp.py
      - run: python3 scripts/check_table_provenance.py
      - run: python3 scripts/test_check_table_provenance.py
      - run: python3 scripts/test_reclaim.py
      # The TypeScript client carries its own copy of the proto, because
      # `@grpc/proto-loader` reads the file at run time and an npm package
      # cannot reach into a sibling crate. Nothing checked the two agreed:
      # a field added to one side only is a client building requests against
      # a schema the server does not have, and no type system sees it.
      - run: python3 scripts/check_proto_copies.py
      - run: python3 scripts/test_check_proto_copies.py

  quickstarts:
    name: the landing page's code
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: head-node
          path: bin
      - run: chmod +x bin/slate-serverd
      # The snippets import the published packages, so the packages have to be
      # installable. This is not scaffolding around the check — it is the
      # check: a reader following the quickstart installs these too, and the
      # first CI run failed here on `No module named 'grpc'` and `Cannot find
      # module '@slate-orm/client'`, both of which had been supplied by an
      # ambient install on the machine where it was written.
      - run: pip install -e clients/python
      - run: npm ci
        working-directory: clients/typescript
      - run: npm run build
        working-directory: clients/typescript
      # The docs site holds together: every relative link resolves, and the
      # `<noscript>` sidebar on each page matches the one `nav.js` renders.
      # Needs no server and no browser, so it runs first and fails fast.
      - run: python3 site/check/docs.py
      # Extracts the four `<pre><code>` panels out of
      # `site/docs/quickstart.html`, validates the TOML with `--check`, starts a
      # node from it, and runs the Python, Go and TypeScript snippets against
      # that node. Its first run found the page's TOML invalid.
      - run: python3 site/check/quickstarts.py
        env:
          SLATE_SERVERD: ${{ github.workspace }}/bin/slate-serverd

  # The playground: the kernel compiled to wasm, driven in a real browser.
  #
  # It is the only part of the site that runs rather than describes, so it is
  # the only part that can break in a way reading cannot catch — a renamed
  # field in the binding, a control wired to nothing, a bundle that never
  # loads. `build-wasm.sh` also enforces a size budget, so a dependency that
  # doubles what a reader downloads fails here rather than on their connection.
  playground:
    name: the kernel in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: `wasm-bindgen-cli` must match the `wasm-bindgen` the crate
      # links, and a mismatch fails at load time in the browser rather than at
      # build time here.
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: sh site/build-wasm.sh
      - run: npm ci
        working-directory: examples/explorer/web
      - run: npx playwright install --with-deps chromium
        working-directory: examples/explorer/web
      - run: python3 site/check/workbench.py

  deployed:
    name: deployed against object storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: deployed
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install grpcio protobuf
      # Go and Node as well: the run asks the same questions through all three
      # SDKs over the same socket, so a job with only Python would silently
      # skip two thirds of it.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The whole stack: a real S3 server, SlateDB on it, a head node with two
      # read replicas on that, and all three SDKs over gRPC — checked against a
      # fold done in Python from the same packed file the browser reads. Then
      # the head node is killed and a new one takes over on the same bucket,
      # and every check runs again.
      #
      # A prefix rather than all 100,000 trips: the load is ~9,000 rows/s
      # through the full path, and the differential checks say the same thing
      # over 20,000 as over all of them. The full run is what `./run.sh` does
      # by default for a person, and what the ledger's numbers came from.
      - run: ./run.sh --trips 20000
        working-directory: examples/deployed

  demo:
    name: three SDKs, one database
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: examples/explorer/backends/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: head-node
          path: bin
      - run: chmod +x bin/slate-serverd
      - run: pip install -e clients/python
      - run: npm ci
        working-directory: clients/typescript
      - run: npm ci
        working-directory: examples/explorer/backends/node
      - run: npm ci
        working-directory: examples/explorer/web
      - run: npx playwright install --with-deps chromium
        working-directory: examples/explorer/web
      # Before the suite, not after: a declaration that has drifted from the
      # catalog makes every request naming that table fail the schema check,
      # so the conformance run below would go red with a hundred confusing
      # failures instead of one line saying which file is stale.
      #
      # This job rather than the `scripts` one because it needs a built
      # `slate-serverd` to resolve the catalog, and this is the job that has
      # one.
      - name: The generated declarations match the catalog
        run: |
          python3 scripts/codegen.py --check \
            --config examples/explorer/head.toml \
            --serverd "${{ github.workspace }}/bin/slate-serverd" \
            --python examples/explorer/backends/python/adapter/schema.py \
            --go examples/explorer/backends/go/schema/schema.go \
            --typescript examples/explorer/backends/node/src/schema.ts \
            --web examples/explorer/web/src/catalog.ts
      # The retention example's declaration is generated too and nothing was
      # checking it, so it silently missed a generator change — which is the
      # drift `--check` exists to catch, on the one generated file that was
      # outside it. Its config carries a `{DIR}` placeholder that `run.sh`
      # substitutes, so this does the same before reading it.
      - name: The retention example's declaration matches its catalog
        run: |
          work=$(mktemp -d)
          sed "s|{DIR}|$work/store|" examples/retention/head.toml > "$work/head.toml"
          python3 scripts/codegen.py --check \
            --config "$work/head.toml" \
            --serverd "${{ github.workspace }}/bin/slate-serverd" \
            --python examples/retention/schema.py
      # The generated decoders, run rather than only compiled.
      #
      # Both shipped type-checking and never executing, which proves they
      # compile and not that they read the right column — and reading the
      # neighbour compiles fine whenever the neighbour shares a type. These
      # are hand-written beside the generated files on purpose: a test the
      # generator emitted would agree with the generator by construction.
      #
      # Here rather than in the Go and TypeScript client jobs because the
      # files under test are generated from the catalog, and this is the job
      # that has just checked them against it.
      # The retention example, run rather than shipped. `purge_deleted` had an
      # RPC and nothing that called it periodically, so a soft-deleting table
      # grew without bound in every deployment that used the convention; the
      # example beside this step is the answer, and an example nothing runs is
      # the defect this repository keeps meeting in other forms.
      #
      # In this job because it needs the built `slate-serverd` and the
      # installed Python client, which this job already has. It brings its own
      # one-table catalog over a `local` directory, so it shares nothing with
      # the demo's schema and needs neither MinIO nor a browser.
      - run: ./run.sh
        working-directory: examples/retention
        env:
          SLATE_SERVERD: ${{ github.workspace }}/bin/slate-serverd
      - run: go test ./schema/
        working-directory: examples/explorer/backends/go
      # The node adapter resolves `@slate-orm/client` to a symlink into
      # `clients/typescript` and imports its *built* `dist/`, which `npm ci`
      # does not produce — `run.sh` builds it explicitly for exactly this
      # reason and says so. The decoder test below runs *before* `run.sh`, so
      # it is the first thing in this job to need the build, and it went red
      # on a missing module rather than on anything it was testing.
      - run: npm run build
        working-directory: clients/typescript
      - run: npm test
        working-directory: examples/explorer/backends/node
      # The only thing anywhere that compares the three clients to *each
      # other*. Each client's own suite compares it to the server, which
      # catches one client being wrong and cannot catch two being wrong the
      # same way — or two quietly disagreeing about something the server
      # accepts from both.
      - run: ./run.sh --conformance
        working-directory: examples/explorer
        env:
          SLATE_SERVERD: ${{ github.workspace }}/bin/slate-serverd
      - run: ./run.sh --e2e
        working-directory: examples/explorer
        env:
          SLATE_SERVERD: ${{ github.workspace }}/bin/slate-serverd

  # The batch benchmark, run rather than asserted.
  #
  # It reports numbers and checks none of them: a wall-clock threshold on a
  # shared runner is a flake waiting for a slow morning, which is why the Rust
  # benchmark reports rather than asserts and why this does too. What CI is for
  # here is the other half — a benchmark nobody runs stops building, and then
  # its numbers are quietly from whatever the code looked like last time
  # somebody tried. This proves it still runs against the current tree.
  #
  # A small N, because the shape is what is being kept alive and not the
  # number. The recorded figures in `docs/performance.md` are from a hundred
  # rows on a quiet machine, and say so.
  batchbench:
    name: batching, from a client
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: examples/batchbench/go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: head-node
          path: bin
      - run: chmod +x bin/slate-serverd
      - run: pip install -e clients/python
      - run: npm ci
        working-directory: clients/typescript
      - run: ./run.sh --rows 20 --runs 2
        working-directory: examples/batchbench
        env:
          SLATE_SERVERD: ${{ github.workspace }}/bin/slate-serverd

  # The head-node benchmarks, run rather than asserted.
  #
  # Same argument as `batchbench` above, learned the hard way twice over. This
  # crate's five benchmarks were built by `cargo clippy --all-targets` and run
  # by nothing, and four of them were broken — three when `leadership` gained
  # authentication, a fourth when `EXPLAIN` became privileged. Both are
  # security fixes to `slate-server` that nobody would think to run a benchmark
  # after, which is exactly why a machine has to.
  #
  # `--smoke` asks each one for the smallest fixture it accepts and checks
  # nothing but the exit code. No threshold: a wall-clock assertion on a shared
  # runner is a flake waiting for a slow morning, and the recorded numbers in
  # `docs/performance.md` come from a quiet machine and say so.
  headbench:
    name: head-node benchmarks, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: crates/slate-headbench/run.sh --smoke

  # The storage examples, run rather than asserted.
  #
  # The same argument as `headbench` above, and this crate has the sharper
  # version of it: `SCAN_ROW_COST` and `POINT_READ_COST` are calibrated *from*
  # these, so a benchmark nobody runs is a planner constant nobody re-measures.
  # `POINT_READ_COST` was three times its measured value when somebody finally
  # ran one.
  #
  # `s3_server` is a server rather than a measurement, so the runner waits for
  # the `LISTENING` line it prints and kills it — a check, not a skip.
  slatedbbench:
    name: storage examples, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: crates/slate-slatedb/run.sh --smoke

  # The kernel's four and the ORM's one, the last two crates that had examples
  # nothing ran.
  #
  # `scripts/check_examples_roster.py` found them — it requires a floor for
  # every workspace member with an `examples/` directory, and the runner named
  # two of four. Unlike `slate-headbench`, where running them for the first
  # time found four of five broken, all five of these already worked; the run
  # is thirty seconds in debug, which is why they get one job rather than two.
  #
  # No `run.sh` wrapper for either crate: those exist so the paths already
  # quoted in `docs/performance.md` stay true, and nothing quotes a path for
  # these. The shared runner is called directly.
  #
  # None of the five reads an environment knob, so `--smoke` runs them at their
  # recorded size. That is the honest thing to say about these numbers: the run
  # proves they still work, and asserts nothing about what they print.
  kernelbench:
    name: kernel and ORM examples, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sh scripts/run_examples.sh slate-kernel --smoke
      - run: sh scripts/run_examples.sh slate-orm --smoke

  # The release build, called rather than copied.
  #
  # Compiles `slate-serverd` for both release targets, installs the aarch64
  # cross toolchain, and runs the shipped binary's `--check` against the
  # landing page's TOML. It publishes nothing — that half lives in
  # `release.yml` and only a `v*` tag reaches it.
  #
  # It is here because a release workflow is otherwise first exercised on the
  # day somebody cuts a release, which is the worst day to discover the aarch64
  # linker is missing, and that is precisely the state `ci.yml` itself was in
  # until this morning.
  release-build:
    name: the release build
    uses: ./.github/workflows/release-build.yml

  minio:
    name: integration against MinIO
    runs-on: ubuntu-latest
    env:
      SLATE_S3_BUCKET: slate-orm
      SLATE_S3_ENDPOINT: http://127.0.0.1:9000
      SLATE_S3_REGION: us-east-1
      SLATE_S3_ACCESS_KEY_ID: minioadmin
      SLATE_S3_SECRET_ACCESS_KEY: minioadmin
      SLATE_S3_ALLOW_HTTP: "true"
    steps:
      - uses: actions/checkout@v4
      # Started as a step rather than a service container, and pulled from
      # quay.io, which took two tries to get right.
      #
      # `bitnami/minio:latest` is what this used, and it does not exist —
      # Bitnami withdrew those tags, so the workflow's first run in its life
      # failed on `manifest unknown` before checking anything out. The obvious
      # replacement, `minio/minio` on Docker Hub, answers `pull access denied
      # ... repository does not exist`. quay.io is MinIO's own registry and
      # serves it anonymously.
      #
      # Pinned to a release rather than `latest`, which is the lesson the
      # Bitnami tag taught in the other direction: an unpinned tag is one
      # upstream decision away from vanishing, and a pinned one at least fails
      # on the day it is removed rather than the day it changes.
      #
      # The official image needs an explicit `server /data`, which the
      # `services:` syntax cannot express — hence `docker run`. The bucket is a
      # pre-made directory under the data volume: MinIO takes each top-level
      # directory there as a bucket, so it exists with no client, no `mc`, and
      # nothing to sign by hand.
      - name: Start MinIO
        run: |
          mkdir -p /tmp/minio/${SLATE_S3_BUCKET}
          chmod -R 777 /tmp/minio
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            -v /tmp/minio:/data \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "minio is live"; exit 0
            fi
            sleep 1
          done
          echo "minio never became live; its log:" >&2
          docker logs minio >&2
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The suite is hermetic by default — it runs an S3 server in this
      # process — so this job exists to catch behaviour specific to a
      # production-grade implementation: conditional writes, multipart
      # thresholds, and error shapes.
      - run: cargo test -p slate-slatedb --test s3
