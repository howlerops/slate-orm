# Lint and type-check configuration for the Python that is *not* the client.
#
# `clients/python` is a package with its own `pyproject.toml`, and ruff and ty
# both resolve the nearest one, so nothing here reaches it.
#
# Everything else is scripts: two code generators, four harnesses under
# `examples/`, three site checks, the three-SDK conformance runner, the
# explorer's Python adapter and the workspace guard. About five thousand lines
# that neither tool had ever seen — which is the shape of problem this
# repository keeps finding. `clients/python` has had ruff and a checker for
# months; the code that *runs CI's other twelve jobs* had neither, so a
# harness could break on a name error in a branch nobody takes and the first
# anyone would know is a red job with a traceback.
#
# Deliberately no `[project]` table. This is not a package, nothing installs
# it, and adding one would make `pip install -e .` at the repository root do
# something — which is a thing somebody would then do by accident.

[tool.ruff]
line-length = 100
# `target/` and `node_modules/` are excluded by ruff's defaults via
# `.gitignore`; these are the ones that are checked in and are not ours.
extend-exclude = [
  "clients/python",
  "examples/explorer/backends/node",
]

# `ruff format` is deliberately not run, here or in `clients/python`.
#
# Measured before deciding: it would reformat 12 of 18 files, and on the file
# it changes most — `examples/explorer/conformance/corpus` — it removes 215
# lines and adds 415. Nearly all of that is one pattern. The corpus is a list
# of `(name, endpoint, body, identity)` tuples, each preceded by the comment
# saying what it compares and separated from the next by a blank line, so a
# case and its reasoning read as a unit. The formatter deletes the blank lines
# (they sit inside a list literal) and explodes each tuple across six lines, so
# a file whose whole job is to be read case by case becomes one nobody scans.
#
# `site/check/workbench.py` is the counter-example and is why this was measured
# rather than assumed: it loses 16 lines and gains 7, all of them ordinary, and
# `clients/python/tests/test_decimal.py` is already formatted. So this is not
# "the formatter is wrong", it is "one file in this tree is laid out on purpose
# and the formatter has no way to know". A per-file skip was considered and
# rejected: a formatter you have to remember to exempt from is a formatter that
# will reformat the next such file on the day somebody forgets.
#
# `ruff check` with `I` still sorts imports, which is the part of formatting
# that actually causes diffs between contributors. Line length is not enforced
# at all — `E501` is in `ignore` below, for the reason written there.

[tool.ruff.lint]
# The families `clients/python` selects, so a contributor moving between the two
# meets one set of rules rather than two — plus `BLE`, which is here and not
# there because this is *scripts*. A harness that swallows an exception reports
# a pass, and "a skip is green" is the failure this repository keeps finding;
# `except Exception` in a checker is the same shape. Three sites here already
# carried `# noqa: BLE001` with a reason beside it, written against a
# configuration that never enabled the rule — so the directives were inert and
# the rule had never run. Enabling it makes those three deliberate and finds
# any fourth.
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = [
  # Long lines are almost all prose in comments, where wrapping to 100 makes
  # the argument harder to follow than the length does.
  "E501",
]

[tool.ty.environment]
# Matches `clients/python`'s floor. Independent of the interpreter that runs
# ty, so CI and a contributor reach the same answer.
python-version = "3.11"

[tool.ty.src]
# Named rather than defaulted, because ty's default is the whole project
# directory and that sweeps in `clients/python` — which has its own
# configuration, its own exclusions and its own `# ty: ignore` spellings.
include = [
  "clients/go/scripts",
  "crates/slate-kernel/scripts",
  "examples/batchbench",
  "examples/deployed",
  "examples/explorer/backends/python",
  "examples/explorer/conformance",
  "scripts",
  "site/check",
  "site/data",
]
# `site/data/make-trips.py` imports `pyarrow.parquet`, which is deliberately not
# a dependency of anything CI installs: the script's own docstring records the
# decision to *commit* its output rather than rebuild it, precisely to keep a
# 50 MB download and a pyarrow dependency out of every run. So `ty` cannot
# resolve that import in the environment it runs in — and *can* on a machine
# that happens to have pyarrow, which is how this arrived: green here, red in
# CI, on a file nobody had changed.
#
# Excluded from `ty` rather than suppressed per line, because a
# `# ty: ignore[unresolved-import]` is itself environment-dependent: it is used
# in CI and *unused* locally, and ty reports an unused directive. A suppression
# that is right in one environment and wrong in the other is worse than none.
#
# `ruff` still checks the file — it resolves no imports, so the name errors,
# the unused imports and the style are all still caught, which is most of the
# value. What is lost is type-checking the one function that reads the parquet.
exclude = ["site/data/make-trips.py"]
